[package]
name = "probe"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The RU-side sensor: runs the probe battery, builds an Observation, and classifies it into a Verdict. classify() is a pure function."

[lib]
name = "probe"
path = "src/lib.rs"

[[bin]]
name = "probe"
path = "src/main.rs"

[dependencies]
lok-contract = { path = "../lok-contract" }
lok-capture = { path = "../lok-capture" }
serde_json = { workspace = true }

# Bind-before-connect (to know our own port before the capture opens) has no std API.
[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[dev-dependencies]
echo-server = { path = "../echo-server" }
